<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Tarayıcıda tamamen internetsiz çalışan, gizlilik odaklı Türkçe yazı ve otomatik düzeltme uygulaması."
    />
    <title>autr — İnternetsiz Türkçe yazı alanı</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("autr:settings:v1");
          var theme = raw ? JSON.parse(raw).theme : null;
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          } else {
            delete document.documentElement.dataset.theme;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
