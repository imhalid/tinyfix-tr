    <script>
      (function () {
        try {
          var raw = localStorage.getItem("autr:settings:v1");
          var theme = raw ? JSON.parse(raw).theme : null;
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          } else {
            delete document.documentElement.dataset.theme;
          }
        } catch (e) {}
      })();
    </script>
